name: Project CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run integration:pack
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-browser-integration
          path: |
            .runtime/dist/*.tgz
            .runtime/dist/*.sha256
          retention-days: 14
