name: Browser Release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Resource preflight, or build all six targets and publish a private PoC release
        type: choice
        options: [preflight, build-release]
        default: preflight
permissions:
  contents: read
concurrency:
  group: browser-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node scripts/verify-model-settings.mjs
      - name: Verify private repository and source version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/CharlesXu/AgenticBrowser --jq .private)" = true
          node -e "const fs=require('fs');const v=require('./package.json').version;if(!/^\d+\.\d+\.\d+$/.test(v))throw Error('Invalid version');fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+v+'\n')"
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: x64
            runner: macos-15-intel
            variable: CHROMIUM_RUNNER_MACOS_X64
          - os: macos
            arch: arm64
            runner: macos-15
            variable: CHROMIUM_RUNNER_MACOS_ARM64
          - os: windows
            arch: x64
            runner: windows-2025
            variable: CHROMIUM_RUNNER_WINDOWS_X64
          - os: windows
            arch: arm64
            runner: windows-11-arm
            variable: CHROMIUM_RUNNER_WINDOWS_ARM64
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            variable: CHROMIUM_RUNNER_LINUX_X64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            variable: CHROMIUM_RUNNER_LINUX_ARM64
    runs-on: ${{ fromJSON(vars[matrix.variable] || format('["{0}"]', matrix.runner)) }}
    timeout-minutes: 360
    name: ${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Runner resource and toolchain preflight
        run: node scripts/chromium-ci.mjs preflight ${{ matrix.os }} ${{ matrix.arch }}
      - if: inputs.mode == 'build-release'
        run: npm ci --ignore-scripts
      - name: Chromium build, runtime smoke and package
        if: inputs.mode == 'build-release'
        run: node scripts/chromium-ci.mjs build ${{ matrix.os }} ${{ matrix.arch }}
      - name: Upload resource and smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ matrix.arch }}
          path: .runtime/ci/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload verified browser package
        if: success() && inputs.mode == 'build-release'
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.os }}-${{ matrix.arch }}
          path: .runtime/release/${{ matrix.os }}-${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    if: inputs.mode == 'build-release'
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-*
          path: .runtime/release-artifacts
      - run: npm ci --ignore-scripts
      - run: npm run integration:pack
      - name: Verify all six packages and publish private pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
