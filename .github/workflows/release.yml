name: Browser Release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Resource preflight, or build all six targets and publish a public PoC release
        type: choice
        options: [preflight, build-one, build-release]
        default: preflight
      target:
        description: Target for build-one (no Release is published)
        type: choice
        options: [macos-x64, macos-arm64, windows-x64, windows-arm64, linux-x64, linux-arm64]
        default: macos-x64
permissions:
  contents: read
concurrency:
  group: browser-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node scripts/verify-release-candidate.mjs
      - run: node scripts/verify-model-settings.mjs
      - name: Verify public repository and source version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/CharlesXu/AgenticBrowser --jq .private)" = false
          node -e "const fs=require('fs');const v=require('./package.json').version;if(!/^\d+\.\d+\.\d+$/.test(v))throw Error('Invalid version');fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+v+'\n')"
      - name: Select build targets
        id: matrix
        env:
          BUILD_MODE: ${{ inputs.mode }}
          BUILD_TARGET: ${{ inputs.target }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          let include = [
            ['macos', 'x64', 'macos-15-intel'], ['macos', 'arm64', 'macos-15'],
            ['windows', 'x64', 'windows-2025'], ['windows', 'arm64', 'windows-11-arm'],
            ['linux', 'x64', 'ubuntu-24.04'], ['linux', 'arm64', 'ubuntu-24.04'],
          ].map(([os, arch, runner]) => ({os, arch, runner, variable: `CHROMIUM_RUNNER_${os}_${arch}`.toUpperCase()}));
          if (process.env.BUILD_MODE === 'build-one') include = include.filter(t => `${t.os}-${t.arch}` === process.env.BUILD_TARGET);
          if (!include.length) throw Error('Unknown build target');
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include})}\n`);
          JS
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ fromJSON(vars[matrix.variable] || format('["{0}"]', matrix.runner)) }}
    timeout-minutes: 360
    name: ${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Runner resource and toolchain preflight
        run: node scripts/chromium-ci.mjs preflight ${{ matrix.os }} ${{ matrix.arch }}
      - if: inputs.mode != 'preflight'
        run: npm ci --ignore-scripts
      - name: Install isolated compiler cache
        if: inputs.mode != 'preflight'
        run: node scripts/setup-ci-ccache.mjs
      - name: Restore completed compilation work
        if: inputs.mode != 'preflight'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime/ccache
          key: ccache-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('chromium/upstream.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('chromium/upstream.json') }}-
      - name: Chromium build, runtime smoke and package
        if: inputs.mode != 'preflight'
        timeout-minutes: 330
        run: node scripts/measure-ci-disk.mjs ${{ matrix.os }}-${{ matrix.arch }} node scripts/chromium-ci.mjs build ${{ matrix.os }} ${{ matrix.arch }}
      - name: Save completed compilation work even after failure
        if: always() && inputs.mode != 'preflight' && steps.cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .runtime/ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload resource and smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ matrix.arch }}
          path: .runtime/ci/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload verified browser package
        if: success() && inputs.mode != 'preflight' && !(matrix.os == 'linux' && matrix.arch == 'arm64')
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.os }}-${{ matrix.arch }}
          path: .runtime/release/${{ matrix.os }}-${{ matrix.arch }}/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7
      - name: Upload cross-built ARM64 candidate for native smoke
        if: success() && inputs.mode != 'preflight' && matrix.os == 'linux' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-linux-arm64
          path: .runtime/release/linux-arm64/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7
  smoke-linux-arm64:
    if: inputs.mode == 'build-release' || (inputs.mode == 'build-one' && inputs.target == 'linux-arm64')
    needs: [validate, build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-linux-arm64
          path: .runtime/candidate/linux-arm64
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth fonts-liberation libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libgtk-3-0t64 libnspr4 libnss3 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6
      - name: Verify candidate and run native ARM64 smoke
        run: node scripts/smoke-linux-arm64.mjs
      - name: Upload native smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-native-linux-arm64
          path: .runtime/ci/*.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 7
      - name: Upload verified browser package
        uses: actions/upload-artifact@v4
        with:
          name: browser-linux-arm64
          path: .runtime/release/linux-arm64/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7
  publish:
    if: inputs.mode == 'build-release'
    needs: [validate, build, smoke-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-*
          path: .runtime/release-artifacts
      - run: npm ci --ignore-scripts
      - run: npm run integration:pack
      - name: Verify all six packages and publish public pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
