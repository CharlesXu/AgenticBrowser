name: Product website
on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/update-site-releases.mjs', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '21 2 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/update-site-releases.mjs
        env:
          RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
